name: نشر التطبيق على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: تجهيز الملفات
        run: |
          mkdir _site
          cp index.html style.css app.js cloud.js config.js manifest.json icon-192.png icon-512.png _site/
          # رقم الإصدار: تاريخ النشر + أول 7 خانات من الـ commit
          VERSION="$(TZ=Asia/Riyadh date +%Y.%m.%d)-${GITHUB_SHA::7}"
          sed -i "s/__APP_VERSION__/$VERSION/g; s/\.\(js\|css\)?v=[0-9]*/.\1?v=$VERSION/g" _site/index.html
          echo "{\"version\": \"$VERSION\"}" > _site/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
